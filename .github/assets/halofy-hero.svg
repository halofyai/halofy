<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Halofy — governed memory for AI agents</title>
  <desc id="desc">A dark product banner showing Halofy's memory custody promise and a compact control-room preview.</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="18" x2="1168" y2="506" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07130F"/>
      <stop offset="0.55" stop-color="#0A1914"/>
      <stop offset="1" stop-color="#07100D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8FF63"/>
      <stop offset="1" stop-color="#42E8A4"/>
    </linearGradient>
    <linearGradient id="panel" x1="705" y1="80" x2="1130" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13251E"/>
      <stop offset="1" stop-color="#0C1813"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9DEBBD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020604" flood-opacity="0.52"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="40" r="175" fill="#52F3A5" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="80" cy="500" r="150" fill="#B8FF63" fill-opacity="0.08" filter="url(#blur)"/>

  <g transform="translate(72 72)">
    <rect width="54" height="54" rx="16" fill="url(#glow)"/>
    <path d="M15 15V39M39 15V39M16 27H38" stroke="#07130F" stroke-width="5.5" stroke-linecap="round"/>
    <text x="72" y="40" fill="#F1FFF7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="750" letter-spacing="-1.4">Halofy</text>
  </g>

  <text x="72" y="200" fill="#F4FFF8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="760" letter-spacing="-2.2">
    <tspan x="72" dy="0">Memory your agents</tspan>
    <tspan x="72" dy="64">can account for.</tspan>
  </text>
  <text x="74" y="348" fill="#A9C7B7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">
    <tspan x="74" dy="0">Custody, access control, provenance, audit, and signed erasure.</tspan>
    <tspan x="74" dy="31">Runs offline. Retrieves through swappable read-only drivers.</tspan>
  </text>

  <g transform="translate(72 424)">
    <rect width="136" height="40" rx="20" fill="#B8FF63"/>
    <circle cx="22" cy="20" r="5" fill="#0A1711"/>
    <text x="36" y="26" fill="#0A1711" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">OFFLINE READY</text>
    <rect x="148" width="144" height="40" rx="20" fill="#12261D" stroke="#2F5945"/>
    <path d="M169 20h10m-5-5v10" stroke="#7EF0AF" stroke-width="2" stroke-linecap="round"/>
    <text x="190" y="26" fill="#D8F5E5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">OPEN KERNEL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="62" width="438" height="396" rx="22" fill="url(#panel)" stroke="#315643"/>
    <rect x="690" y="62" width="438" height="54" rx="22" fill="#152A21"/>
    <path d="M690 94H1128" stroke="#315643"/>
    <circle cx="718" cy="89" r="5" fill="#FF7B72"/>
    <circle cx="738" cy="89" r="5" fill="#F5C451"/>
    <circle cx="758" cy="89" r="5" fill="#55D38A"/>
    <text x="788" y="95" fill="#DDF5E8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">CONTROL ROOM</text>

    <rect x="710" y="134" width="116" height="304" rx="14" fill="#0C1914" stroke="#233E31"/>
    <g fill="#7FA391" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">
      <text x="730" y="170">HOME</text>
      <text x="730" y="208">MEMORY</text>
      <text x="730" y="246">POLICIES</text>
      <text x="730" y="284">SOURCES</text>
      <text x="730" y="322">AUDIT</text>
      <text x="730" y="360">CONFLICTS</text>
    </g>
    <rect x="718" y="184" width="100" height="36" rx="9" fill="#173527"/>
    <circle cx="722" cy="204" r="3" fill="#B8FF63"/>
    <text x="730" y="208" fill="#E9FFF2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">MEMORY</text>

    <text x="850" y="159" fill="#EFFFF5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Memory health</text>
    <text x="850" y="181" fill="#72917F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Live governance signals</text>

    <g transform="translate(850 198)">
      <rect width="119" height="78" rx="12" fill="#10231A" stroke="#284B39"/>
      <text x="14" y="25" fill="#83A894" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">VALID FACTS</text>
      <text x="14" y="57" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="750">2,418</text>
      <path d="M88 56l8-9 7 5 8-15" stroke="#65E9A1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(981 198)">
      <rect width="125" height="78" rx="12" fill="#10231A" stroke="#284B39"/>
      <text x="14" y="25" fill="#83A894" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">AUDIT CHAIN</text>
      <text x="14" y="57" fill="#B8FF63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="750">VERIFIED</text>
    </g>

    <rect x="850" y="290" width="256" height="126" rx="12" fill="#10231A" stroke="#284B39"/>
    <text x="865" y="315" fill="#DDF5E8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Recent custody events</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <circle cx="868" cy="340" r="4" fill="#65E9A1"/>
      <text x="880" y="344" fill="#9BB9A9">write</text><text x="930" y="344" fill="#DDF5E8">provenance recorded</text>
      <circle cx="868" cy="369" r="4" fill="#B8FF63"/>
      <text x="880" y="373" fill="#9BB9A9">policy</text><text x="930" y="373" fill="#DDF5E8">access enforced</text>
      <circle cx="868" cy="398" r="4" fill="#8BB8FF"/>
      <text x="880" y="402" fill="#9BB9A9">forget</text><text x="930" y="402" fill="#DDF5E8">certificate signed</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="519" rx="27.5" stroke="#315643" stroke-opacity="0.7"/>
</svg>
