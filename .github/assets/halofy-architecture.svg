<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Halofy architecture</title>
  <desc id="desc">Agents enter through MCP, HTTP, CLI, or console; identity and policy gate separate custody writes from delegated reads over a single Postgres authority and append-only audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FAF6"/>
      <stop offset="1" stop-color="#EDF7F1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163E2C"/>
      <stop offset="1" stop-color="#0E2B20"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8V0Z" fill="#668676"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="448" rx="19" stroke="#C9DDD1"/>

  <text x="600" y="65" text-anchor="middle" fill="#173429" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">AGENTS · APPLICATIONS · OPERATORS</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="middle">
    <rect x="322" y="82" width="125" height="40" rx="20" fill="#FFFFFF" stroke="#B8D2C3"/><text x="384" y="107" fill="#254437">MCP</text>
    <rect x="459" y="82" width="125" height="40" rx="20" fill="#FFFFFF" stroke="#B8D2C3"/><text x="521" y="107" fill="#254437">HTTP</text>
    <rect x="596" y="82" width="125" height="40" rx="20" fill="#FFFFFF" stroke="#B8D2C3"/><text x="658" y="107" fill="#254437">CLI</text>
    <rect x="733" y="82" width="145" height="40" rx="20" fill="#FFFFFF" stroke="#B8D2C3"/><text x="805" y="107" fill="#254437">CONSOLE</text>
  </g>
  <path d="M600 126V151" stroke="#668676" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355" y="158" width="490" height="64" rx="15" fill="url(#green)"/>
  <circle cx="388" cy="190" r="14" fill="#B8FF63"/>
  <path d="M382 190l4 4 8-9" stroke="#133729" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="185" fill="#F4FFF8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="720">Identity + policy gate</text>
  <text x="420" y="204" fill="#A8C8B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">namespace · actor · role resolved from the credential, never the request body</text>

  <path d="M600 222V244M600 244H325V267M600 244H875V267" stroke="#668676" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="270" width="410" height="116" rx="18" fill="#FFFFFF" stroke="#B8D2C3"/>
  <text x="145" y="301" fill="#183A2B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="740">WRITE · custody</text>
  <text x="145" y="328" fill="#496B5A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">extract → verify → resolve → dedupe</text>
  <text x="145" y="350" fill="#496B5A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">supersede → provenance → audit</text>
  <rect x="394" y="300" width="108" height="58" rx="12" fill="#EBF8EF"/>
  <text x="448" y="325" text-anchor="middle" fill="#276044" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">NEVER</text>
  <text x="448" y="344" text-anchor="middle" fill="#276044" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">OVERWRITE</text>

  <rect x="670" y="270" width="410" height="116" rx="18" fill="#FFFFFF" stroke="#B8D2C3"/>
  <text x="695" y="301" fill="#183A2B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="740">READ · delegated</text>
  <text x="695" y="328" fill="#496B5A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ACL-scoped view → driver → ranked refs</text>
  <text x="695" y="350" fill="#496B5A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">baseline · graph · external sidecar</text>
  <rect x="944" y="300" width="108" height="58" rx="12" fill="#EBF8EF"/>
  <text x="998" y="325" text-anchor="middle" fill="#276044" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">READ-ONLY</text>
  <text x="998" y="344" text-anchor="middle" fill="#276044" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">IMPORT FENCE</text>

  <path d="M325 386V407H600M875 386V407H600V420" stroke="#668676" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="266" y="421" width="668" height="55" rx="15" fill="#173B2C"/>
  <text x="293" y="445" fill="#F2FFF7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="720">POSTGRES / PGLITE · one authority</text>
  <text x="293" y="464" fill="#A7C7B7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">memory + vectors + policy + tombstones + append-only audit · encrypted Git-versioned L3 knowledge</text>
</svg>
