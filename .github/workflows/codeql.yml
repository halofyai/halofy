name: CodeQL

# Static security analysis. This complements, and does not replace, the
# adversarial review that auth, ACL, tenancy, audit, migrations and the
# write/retrieval boundary get by hand — CodeQL will not find a namespace
# prefix-match that is wrong but well typed.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    # Weekly, so a newly published query pack finds existing code without
    # waiting for someone to open a pull request.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
