apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: halomem-kernel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halomem-kernel
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8787
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: UDP
          port: 53
